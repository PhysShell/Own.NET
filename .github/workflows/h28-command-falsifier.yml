name: H-28 DbCommand falsifier

on:
  pull_request:
    paths:
      - '.github/workflows/h28-command-falsifier.yml'
      - 'corpus/ownership-lab/h28-command/**'
      - 'frontend/roslyn/OwnSharp.Extractor/**'
      - 'ownlang/**'
      - 'docs/notes/h28-npgsql-command-resolution.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  h28-required-gates:
    name: H-28 required runtime + extractor gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Install self-contained PostgreSQL 16 harness
        run: python -m pip install 'pgserver==0.1.4'
      - name: Run mandatory G1-G3 gates (SKIP is failure)
        run: corpus/ownership-lab/h28-command/run.sh all-required
      - name: Preserve source facts and runtime observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: h28-command-falsifier
          if-no-files-found: warn
          path: |
            corpus/ownership-lab/h28-command/evidence/g3-CommandDispose.facts.json
            corpus/ownership-lab/h28-command/evidence/g3-CommandDispose.summaries.json
            corpus/ownership-lab/h28-command/evidence/g3-CommandDispose.sarif.json
            corpus/ownership-lab/h28-command/evidence/g3-CommandDispose.log
            corpus/ownership-lab/h28-command/evidence/g3-*.log
            corpus/ownership-lab/h28-command/evidence/runtime-*.log
            corpus/ownership-lab/h28-command/evidence/runtime-*.out
