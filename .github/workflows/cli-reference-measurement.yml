# TEMPORARY — #261 H.0, the Windows half of the reference measurement.
#
# This workflow exists to answer three questions the implementing environment
# (Linux-only) could not: what does `python -m ownlang ownir` do on WINDOWS
# when it prints non-ASCII through a pipe, when its stdout is closed, and when
# it is interrupted. #261's SIGINT ruling is "measure the Windows and Linux
# reference first and record it; do not invent 130 as a universal contract",
# and a measurement nobody took is not a measurement.
#
# It runs the REFERENCE, not the port, and it asserts nothing: every step
# prints what it saw and exits 0. Nothing gates on it.
#
# **It is deleted once its run is recorded in docs/notes/p022-cli-ownir.md.**
# If you are reading this on a merged commit, that deletion was missed — the
# file has no reason to outlive the note it fed.
name: CLI reference measurement (TEMPORARY, #261 H.0)

on:
  push:
    branches:
      - claude/rust-ownir-executable-6h1zrp

permissions:
  contents: read

jobs:
  windows-reference:
    name: python -m ownlang ownir, measured on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Non-ASCII output, and the OS error text
        shell: bash
        run: python scripts/measure_cli_reference.py streams

      - name: Closed stdout
        shell: bash
        run: python scripts/measure_cli_reference.py closed-stdout

      - name: Interruption (CTRL_BREAK to a new process group)
        shell: bash
        run: python scripts/measure_cli_reference.py interrupt
