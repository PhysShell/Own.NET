name: owen-vs-probe

permissions:
  contents: read

on:
  push:
    branches: ["ccr-*"]
    paths: [".github/workflows/owen-vs-probe.yml", "scripts/vs/**"]

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: probe Visual Studio
        shell: powershell
        run: scripts/vs/probe.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: vs-probe
          path: vs-probe/
