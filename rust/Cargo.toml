# The Rust core workspace (P-022). The crate graph IS the architecture: the
# allowed dependency edges are documented in docs/proposals/P-022-rust-core-migration.md
# and will be locked by a `cargo metadata` fitness test as crates are added.
#
# Population order follows the migration plan (strangler-fig, oracle-gated):
# own-ir (here) -> own-syntax -> own-cfg -> own-analysis -> own-diagnostics ->
# own-codegen -> own-bridge -> own-cli. Python stays authoritative until parity.

[workspace]
resolver = "2"
members = ["crates/own-ir", "crates/own-syntax", "crates/own-cfg", "crates/own-diagnostics", "crates/own-analysis", "crates/own-lowered", "crates/own-bridge", "crates/own-shadow", "crates/own-cli"]

[workspace.package]
edition = "2021"
rust-version = "1.74"          # floor for declarative [workspace.lints]
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Unicode general categories — the data behind CPython's str.isprintable(),
# which py_repr (error-text parity) must reproduce. unicode-rs org, zero deps.
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }
# SHA-256 for the shadow-mode input digest (own-shadow only; P-022 step 7a).
# A DELIBERATE dependency addition to a deliberately lean workspace: the
# reference side is `hashlib.sha256` (CPython stdlib), and a hand-rolled
# digest in a crate that denies `arithmetic_side_effects` and
# `indexing_slicing` would trade an audited implementation for a page of
# justified suppressions. No CORE crate depends on it — see
# own-diagnostics/tests/dag.rs.
sha2 = { version = "0.10", default-features = false }

# Strictness per P-022 §"Compiler strictness" — inherited by every crate via
# `[lints] workspace = true`. pedantic/nursery stay WARN (surgical, justified
# allows only); the restriction lints are denied surgically.
[workspace.lints.rust]
unsafe_code = "forbid"          # forbid where unsafe isn't needed — cannot be overridden
unreachable_pub = "deny"        # a pub nobody sees is a lie in the API
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
panic = "deny"
dbg_macro = "deny"
print_stdout = "deny"

# Release profile per P-022. `panic` is deliberately NOT set here, and the note
# that used to stand in this place — "panic is per-binary: abort for own-cli,
# unwind for any LSP binary" — was a stale design note rather than a plan Cargo
# can execute: a profile applies to EVERY target of a build, so there is no
# per-package `panic` and a `panic = "abort"` written here would abort the whole
# workspace, an LSP binary included.
#
# The workspace therefore keeps the default `unwind`, and #261 rules that this
# is the contract build for `own-cli`: a custom panic hook suppresses the
# default output and a top-level `catch_unwind` turns an ordinary panic into one
# actionable stderr diagnostic and exit 70 (never 101). A hook alone would only
# OBSERVE the panic; the catch is what produces the exit code, and it needs
# unwinding to exist. Corrected here and in its P-022 mirror as a design note,
# not as a behaviour change: nothing about the built artifacts moves.
[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
