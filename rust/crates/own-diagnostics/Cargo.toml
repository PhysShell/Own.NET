[package]
name = "own-diagnostics"
description = "Diagnostic/Evidence verdict model, canonical render/ordering, and the SARIF 2.1.0 projection (an exact port of ownlang/diagnostics.py, diag_sarif.py and evidence.py)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
version = "0.1.0"

# Per P-022 §crate-topology this crate is UPSTREAM of the solver: `own-analysis`
# *constructs* these types, so it depends on `own-diagnostics`, never the
# reverse. `own-diagnostics` itself may depend only on the span/location leaf
# (`own-ir`) — never on `own-syntax` (the parser) or `own-analysis` (the
# solver). It now takes that one allowed edge: the verdict `line` is
# `own_ir::span::SourceLine`, because #326 made the signed-64 range part of the
# OwnIR contract and the reference carries it onto the verdict surface verbatim
# — a narrower carrier here would refuse verdicts the strict door admits. The
# DAG edge test (`tests/dag.rs`) locks the allowed set.
[dependencies]
own-ir = { path = "../own-ir" }
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
