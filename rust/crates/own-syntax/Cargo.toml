[package]
name = "own-syntax"
description = "OwnLang lexer + recursive-descent parser + AST, error-message-parity port of ownlang/{lexer,parser,ast_nodes}.py"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
version = "0.1.0"

[dependencies]
# The shared span/location leaf: SourceLine lives there so a coordinate can
# cross the workspace without dragging the parser along (P-022).
own-ir = { path = "../own-ir" }
unicode-properties = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
