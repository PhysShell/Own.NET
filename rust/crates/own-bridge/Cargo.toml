# The OwnIR bridge (P-022 step 6b, #259): facts -> Layer 2 lowering -> the
# core -> verdicts. A pure transformation crate — no filesystem, no CLI;
# fixture I/O lives only in the integration tests. It is the one deliberately
# WIDE consumer in the DAG (ir + lowered + syntax + cfg + analysis +
# diagnostics): that width is its job, and the constraint runs the other way —
# only entry-point crates (own-cli, a future own-lsp/own-capi) may depend on
# it, never a core crate (P-022 §fitness; own-diagnostics/tests/dag.rs).
[package]
name = "own-bridge"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "OwnIR bridge: facts -> Layer 2 lowering -> core analyses -> verdicts (Python check_facts parity)"

[dependencies]
own-ir = { path = "../own-ir" }
own-lowered = { path = "../own-lowered" }
# The analysis wiring (#259 cp4): the lowering CONSTRUCTS the core AST
# (own-syntax), drives own-cfg/own-analysis through `check_module`, and reads
# the verdict model (own-diagnostics) to map results back to fact handles.
own-syntax = { path = "../own-syntax" }
own-cfg = { path = "../own-cfg" }
own-analysis = { path = "../own-analysis" }
own-diagnostics = { path = "../own-diagnostics" }
serde_json.workspace = true
# The BR-V9 SARIF log (#259 cp5.3) is typed structs whose FIELD ORDER is the
# surface: the reference builds Python dicts and `json.dumps` writes them in
# insertion order, so the shape is checked at compile time rather than
# assembled as a free-form value.
serde.workspace = true

[lints]
workspace = true
