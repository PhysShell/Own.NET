[project]
name = "ownlang"
version = "0.0.0"
description = "A tiny ownership / borrow / lifetime checker for a resource DSL that lowers to C#."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# High-signal rules only. SIM (flake8-simplify) is deliberately omitted: its
# nested-if collapsing fights intentional, commented branch structure here.
#   E/W pycodestyle · F pyflakes · I import order · B bugbear gotchas
#   UP pyupgrade · C4 comprehensions · RUF ruff-native
select = ["E", "W", "F", "I", "B", "UP", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
# scripts/perf_baseline.py is an INSTRUMENT SOURCE: its bytes are hashed into
# the measurement harness digest that the frozen #263 preregistration names
# (104c384d01bf), and steps 4, 5 and 6 are bound to that same value. Rewrapping
# a line there is not a cosmetic edit — it moves the digest and makes the frozen
# contract point at an identity the tree no longer contains, which is exactly
# what scripts/step7/mergegate.py exists to refuse. So the one over-long line
# stays and the linter is told why, rather than the instrument being reformatted
# to please it. Lift this only together with a re-binding of steps 4/5/6.
"scripts/perf_baseline.py" = ["E501"]

[tool.mypy]
# The package is held to --strict. Tests/fuzzers are not (they lean on dynamic
# construction and an AST oracle); ruff still covers them. The evidence tooling
# IS held to --strict: the one interpretation of the verdict ledger and of a
# mutation campaign that both the test gate and the status renderer depend on
# must not be the one untyped link in the chain.
python_version = "3.11"
files = [
  "ownlang",
  "tests/coordinate_census.py",
  "tests/verdict_census.py",
  "tests/verdict_render_census.py",
  "tests/validation_census.py",
  "tests/verdict_surface_inventory.py",
  "tests/shadow_sweep.py",
  "tests/test_obligation_fact_parity.py",
  "scripts/perf_baseline.py",
  "scripts/p037_controls.py",
  "scripts/p037_evidence.py",
  "scripts/p037_mos_snapshot.py",
  "scripts/p037_verdict_snapshot.py",
  "scripts/p037_fact_shapes.py",
  "scripts/round7/classify.py",
  "scripts/round7/elfread.py",
  "scripts/round7/preflight.py",
  "scripts/round7/schedule.py",
  "scripts/round7/runner.py",
  "scripts/round7/readout.py",
  "scripts/calibration/policy.py",
  "scripts/training/scope.py",
  "scripts/step7/envcapture.py",
  "scripts/mutate_campaign.py",
  "scripts/shadow_compare.py",
  "scripts/render_checkpoint_status.py",
]
mypy_path = ["tests", "scripts", "scripts/round7", "scripts/calibration", "scripts/training",
             "scripts/step7"]
explicit_package_bases = true
strict = true
